<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWEB1 — Cap. 07 — AT01 — Cartão de Apresentação</title>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .cartao {
      background-color: #ffffff;
      max-width: 400px;
      margin: 40px auto;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .cartao-nome {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1a365d;
      margin-bottom: 0;
    }

    hr, .cartao-divisor {
      border: 0;
      border-top: 2px dashed #3182ce;
      margin: 1.5rem auto;
      width: 60%;
    }

    .cartao-cargo {
      font-size: 1.1rem;
      font-style: italic;
      color: #4a5568;
      font-weight: 500;
    }

    .cartao-email {
      font-size: 0.9rem;
      color: #e96994;
    }

    header p a {
      color: #0752a8;
      text-decoration: none;
    }
    header p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Atividade 01 — Cartão de Apresentação</h1>
    <p><a href="../index.html">← Voltar para a página principal</a></p>
  </header>

  <main>
    <article class="cartao">
      <h1 class="cartao-nome">Gabriela Alves Ferreira</h1>
      <hr class="cartao-divisor" />
      <p class="cartao-cargo">Estudante de Sistemas de Informação — IFAL</p>
      <p class="cartao-email">gaf2@aluno.ifal.edu.br</p>
    </article>
  </main>

</body>
</html>
